<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
/* Abschluss-Bild für Reels (1080 × 1920). Texte liegen in der sicheren Zone:
   oben 250 px, unten 420 px und rechts 130 px frei (dort liegen Instagrams Name, Text und Knöpfe).
   Beispielgrafiken aus landing/ (erfundener Beispielverein). */
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;font-family:Inter,Arial,sans-serif;color:#fff;overflow:hidden;position:relative;
 background:radial-gradient(circle at 50% 44%,#1f5cf070 0,transparent 40%),radial-gradient(circle at 10% 92%,#f0a35e26 0,transparent 40%),linear-gradient(170deg,#0b1d3a 0%,#081428 55%,#050c1a 100%)}
.stripes{position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 46px,#ffffff06 46px 54px)}
.wrap{position:absolute;top:240px;left:80px;right:130px;bottom:420px;display:flex;flex-direction:column;align-items:center;text-align:center}
.brand{display:flex;align-items:center;gap:22px}
.brand img{width:112px;height:112px;border-radius:28px;box-shadow:0 0 0 4px #ffffff14,0 12px 40px #1f5cf080}
.brand div{font-size:84px;font-weight:900;letter-spacing:-1px;line-height:1}
.brand span{color:#4f8bff}
.tag{font-size:42px;font-weight:800;margin-top:26px;line-height:1.18}
.tag span{color:#f0a35e}
/* Fächer mit Beispielgrafiken */
.fan{position:relative;width:100%;height:640px;margin-top:20px}
.fan img{position:absolute;left:50%;top:50%;border-radius:18px;box-shadow:0 18px 50px #000a,0 0 0 2px #ffffff22;object-fit:cover}
.c0{width:330px;height:587px;transform:translate(-50%,-50%);z-index:5}
.c1,.c2{width:290px;height:362px;z-index:4}
.c1{transform:translate(calc(-50% - 215px),calc(-50% + 20px)) rotate(-9deg)}
.c2{transform:translate(calc(-50% + 215px),calc(-50% + 20px)) rotate(9deg)}
.c3,.c4{width:250px;height:312px;z-index:3;filter:brightness(.82)}
.c3{transform:translate(calc(-50% - 375px),calc(-50% + 70px)) rotate(-17deg)}
.c4{transform:translate(calc(-50% + 375px),calc(-50% + 70px)) rotate(17deg)}
.cta{margin-top:24px;width:100%;background:linear-gradient(135deg,#f0a35e,#f07a3e);border-radius:32px;padding:26px 26px 28px;box-shadow:0 20px 60px #f07a3e55;
 font-size:60px;font-weight:900;line-height:1.06;text-shadow:0 3px 10px #0003}
.price{font-size:27px;color:#c3cfe6;margin-top:18px;font-weight:600}
.url{margin-top:auto;display:flex;align-items:center;gap:18px}
.url .u{font-size:48px;font-weight:900;background:#fff;color:#0b1d3a;padding:12px 30px;border-radius:20px}
.url .l{font-size:27px;font-weight:700;color:#b9c8e6;text-align:left;line-height:1.2}
</style></head><body><div class="stripes"></div><div class="wrap">
<div class="brand"><img src="../../icons/icon-512.png" alt=""><div>Match-<span>Shot</span></div></div>
<div class="tag">Profi-Grafiken für euren Verein –<br><span>direkt am Handy.</span></div>
<div class="fan">
 <img class="c3" src="../../landing/potm.webp" alt="">
 <img class="c4" src="../../landing/wochenende.webp" alt="">
 <img class="c1" src="../../landing/post-feed.webp" alt="">
 <img class="c2" src="../../landing/ergebnis.webp" alt="">
 <img class="c0" src="../../landing/tor.webp" alt="">
</div>
<div class="cta">Jetzt 1 Monat<br>kostenlos testen</div>
<div class="price">danach ab 24,99 € pro Saison – für den ganzen Verein</div>
<div class="url"><div class="u">match-shot.de</div><div class="l">🔗 Link<br>in Bio</div></div>
</div></body></html>
